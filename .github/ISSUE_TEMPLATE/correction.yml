name: Report an error in a record
description: A page shows something the publisher's own record contradicts.
title: "Correction: "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        AuditLine repeats what inspectors general publish. If a page misstates the publisher's record, say so here.
        If the publisher's own record is wrong, the publisher has to correct it; AuditLine shows the change the next time it reads the file.
        Please do not include personal data.
  - type: input
    id: number
    attributes:
      label: Publisher and recommendation number
      placeholder: "HHS OIG 09-A-02-322.01"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong, and what does the publisher's record say?
      description: Link the publisher's tracker or report.
    validations:
      required: true

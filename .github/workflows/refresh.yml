# Weekly: download each publisher's official export, record what changed, check the source links,
# then test, build, guard, publish, and commit the data.
#
# Safe to re-run at any time: a publisher read successfully in the last 20 hours is not asked again,
# and reading the same file twice records nothing new. Fails safe: a publisher that refuses, cannot
# be reached, or sends a file that fails the quality gates keeps its last good records (every page
# shows the date its publisher's file was last read); a failed test, guard or browser check stops
# before deploy, so the last good site stays live.
name: Refresh and deploy

on:
  schedule:
    - cron: "19 6 * * 2"    # Tuesday 06:19 UTC
    - cron: "43 6 * * 5"    # Friday 06:43 UTC: a second read each week, and the backstop if Tuesday's run was skipped
  push:
    branches: [main]
    paths-ignore: ["data/**", "**.md", "docs/**", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:
    inputs:
      refresh:
        description: Read the publishers before building (off = rebuild and deploy only)
        type: boolean
        default: true
      force:
        description: Ask every publisher again even if it was read in the last 20 hours
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  # Cutover settings (repository variables). SITE_URL is the one base-URL setting.
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
  SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}     # "true" at cutover; unset = staged (noindex, no sitemap, no IndexNow)
  GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}
  WATCHLIST_URL: ${{ vars.WATCHLIST_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      indexnow: ${{ steps.ping.outputs.indexnow }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read the publishers (each fails on its own and keeps its last good records)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then ARG="--force"; else ARG=""; fi
          python3 -m auditline.refresh $ARG

      - name: Tests
        run: python3 -m unittest discover -s tests -t .

      - name: Build the site
        run: python3 -m auditline.build --site _site

      - name: Share cards
        run: python3 -m auditline.og --site _site

      - name: Guard the build
        run: python3 -m auditline.guard _site

      - name: Browser check (headless Chrome against the build)
        run: python3 -m auditline.e2e _site

      - name: Decide whether search engines need telling
        id: ping
        run: |
          curl -fsS "$SITE_URL/urls.txt" -o prev-urls.txt || : > prev-urls.txt
          if [ -s _site/urls.txt ] && { [ "$GITHUB_EVENT_NAME" != "schedule" ] || ! cmp -s prev-urls.txt _site/urls.txt; }; then
            echo "indexnow=true" >> "$GITHUB_OUTPUT"
          else
            echo "indexnow=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -q -m "data: publisher files read $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::warning::Could not push the data; the next run will read the publishers again."

      - name: Keep the schedules alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/keepalive.sh refresh.yml selftest.yml

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - uses: actions/upload-artifact@v7
        with:
          name: urls
          path: _site/urls.txt
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.again.outputs.page_url }}
    steps:
      # GitHub Pages sometimes stalls while syncing a site of this size and the step times out.
      # The same build is offered once more before the run is called failed. Either way the last good site stays live.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - id: again
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

  after:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: urls
          path: urls
      - name: Check the live site
        run: |
          for i in 1 2 3 4 5; do
            if python3 -m auditline.selftest --site-url "$SITE_URL"; then exit 0; fi
            echo "Live site not consistent yet; retrying in 30 s"; sleep 30
          done
          exit 1
      - name: Tell IndexNow (skipped while staged; never fails the run)
        if: always() && needs.build.outputs.indexnow == 'true'
        run: python3 -m auditline.indexnow --urls urls/urls.txt || true

# Weekly: run the tests, check that every publisher was read in time, and check the live site,
# including a spread of recommendation pages. If the live build or a publisher's copy is stale
# (GitHub skipped the scheduled reads), start "Refresh and deploy".
# Reads only this project's own site and data. A failure emails the repository owner.
name: Weekly self-test

on:
  schedule:
    - cron: "37 8 * * 0"   # Sunday 08:37 UTC
    - cron: "7,27,47 * 10,11 11 *"   # TEMPORARY (fires only on 10 and 11 November): proves the schedule trigger; removed after one passing run
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
  SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 -m unittest discover -s tests -t .
      - name: Live site and sampled recommendation pages
        id: live
        run: |
          set +e
          python3 -m auditline.selftest --site-url "$SITE_URL" | tee selftest.log
          code=${PIPESTATUS[0]}
          grep -q '^stale=true' selftest.log && echo "stale=true" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Every publisher read successfully in time
        id: fresh
        if: always()
        run: python3 -m auditline.refresh --check-fresh || { echo "stale=true" >> "$GITHUB_OUTPUT"; exit 1; }
      - name: Start a refresh if the live build or a publisher's copy is stale
        if: always() && (steps.live.outputs.stale == 'true' || steps.fresh.outputs.stale == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow refresh.yml --limit 5 --json status -q '[.[] | select(.status != "completed")] | length')
          if [ "$busy" = "0" ]; then
            gh workflow run refresh.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "::warning::The live build or a publisher's copy was stale; started Refresh and deploy."
          fi
      - name: Keep the schedules alive
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/keepalive.sh refresh.yml selftest.yml
